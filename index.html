<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>For You ❤️</title>
	<style>
		:root{--bg1:#ffafbd;--bg2:#ffc3a0;--accent:#ff416c}
		html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial}
		body{display:grid;place-items:center;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:#fff}
		.page{max-width:900px;padding:24px;text-align:center}
		h1{font-size:2.4rem;margin:0 0 8px}
		p.lead{opacity:.95;margin:0 0 18px}

		/* Overlay modal */
		.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);backdrop-filter:blur(3px);z-index:9999}
		.modal{background:linear-gradient(180deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));border-radius:16px;padding:28px 28px 20px;box-shadow:0 12px 40px rgba(0,0,0,.35);width:min(680px,92%);text-align:center;color:#fff}

		/* Heart */
		.heart{width:160px;height:160px;margin:0 auto 14px;display:block}
			.heart svg{width:140px;height:140px;display:block;filter:drop-shadow(0 8px 20px rgba(255,65,108,.22))}
			.beat{animation:beat 1000ms infinite cubic-bezier(.33,.7,.4,1);transform-origin:center center}
			@keyframes beat{0%{transform:scale(1) rotate(0deg)}25%{transform:scale(1.14) rotate(-3deg)}40%{transform:scale(1) rotate(0deg)}60%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1) rotate(0deg)}}
		.message{font-size:1.05rem;margin-bottom:16px}
		.small{opacity:.9;font-size:.95rem}

		.actions{display:flex;gap:12px;justify-content:center;margin-top:8px}
		.btn{background:transparent;border:2px solid rgba(255,255,255,.18);color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600}
		.btn.primary{background:linear-gradient(90deg,var(--accent),#ff7aa2);border:none}
		.btn:active{transform:translateY(1px)}

		/* subtle floating hearts in background */
		.float-heart{position:fixed;pointer-events:none;opacity:.12;mix-blend-mode:screen}
	</style>
</head>
<body>
	<main class="page">
		<!-- Title and subtitle removed per request (minimal landing) -->
		<button id="openBtn" class="btn primary">Open the Surprise ❤️</button>
	</main>

	<div id="overlay" class="overlay" aria-hidden="true" style="display:none">
		<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
			<div class="heart" aria-hidden="true">
				<!-- Replaced with a cleaner heart SVG and refined animation -->
				<svg viewBox="0 0 48 48" class="beat" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
					<defs>
						<linearGradient id="g" x1="0" x2="1">
							<stop offset="0" stop-color="#ff416c"/>
							<stop offset="1" stop-color="#ff7aa2"/>
						</linearGradient>
						<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
							<feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ff416c" flood-opacity="0.28"/>
						</filter>
					</defs>
					<path d="M24 42s-18.5-11.7-18.5-22.5A9.5 9.5 0 0 1 24 10a9.5 9.5 0 0 1 18.5 9.5C42.5 30.3 24 42 24 42z" fill="url(#g)" filter="url(#shadow)"/>
				</svg>
			</div> 
			<h2 id="modalTitle">爱你宝宝</h2>
			<p class="message">Every moment with you fills my heart. I hope this little surprise makes you smile.</p>
			<div class="actions">
				<button id="closeBtn" class="btn">Close</button>
				<!-- 'Send a kiss' removed per request; 'Give a kiss' remains as interactive feature -->
			</div>
			<p class="small">Tip: tap anywhere outside to close.</p>
		</div>
	</div>

	<script>
		const overlay = document.getElementById('overlay');
		const openBtn = document.getElementById('openBtn');
		const closeBtn = document.getElementById('closeBtn');
		// shareBtn removed: no separate "Send a kiss" button anymore

		function show() {
			overlay.style.display = 'grid';
			overlay.setAttribute('aria-hidden','false');
			document.body.style.overflow = 'hidden';
		}
		function hide() {
			overlay.style.display = 'none';
			overlay.setAttribute('aria-hidden','true');
			document.body.style.overflow = '';
		}

		// Do NOT auto-show on load; user must tap the button to reveal the surprise.
		// (Removes automatic modal display so the page is not intrusive.)

		openBtn.addEventListener('click', show);
		closeBtn.addEventListener('click', hide);
		overlay.addEventListener('click', (e)=>{
			if (e.target === overlay) hide();
		});

		// No separate share button — 'Give a kiss' handles copy/share behavior.

		// ========== Give a kiss feature ===========
		// Creates a little flying heart animation from the button into the modal
		const kissBtn = document.createElement('button');
		kissBtn.className = 'btn primary';
		kissBtn.id = 'kissBtn';
		kissBtn.textContent = 'Give a kiss 😘';
		kissBtn.style.marginLeft = '6px';

		// Insert kiss button into the actions container
		const actions = document.querySelector('.actions');
		actions.appendChild(kissBtn);

		// kiss animation CSS (injected at runtime for simplicity)
		const style = document.createElement('style');
		style.textContent = `
			.kiss-bubble{position:fixed;z-index:10000;font-size:28px;pointer-events:none;transform:translate(-50%,-50%);opacity:0}
			@keyframes kissFly{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}60%{opacity:1;transform:translate(-50%,-160%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-220%) scale(0.6)}
		`;
		document.head.appendChild(style);

		async function doKiss(e){
			// Create the floating heart element
			const b = document.createElement('div');
			b.className = 'kiss-bubble';
			b.textContent = '💋';
			document.body.appendChild(b);

			// Position at button
			const rect = e.currentTarget.getBoundingClientRect();
			b.style.left = (rect.left + rect.width/2) + 'px';
			b.style.top = (rect.top + rect.height/2) + 'px';

			// Trigger animation via inline style (uses CSS keyframes)
			b.style.animation = 'kissFly 1100ms ease-out forwards';

			// Optional: small 'pop' sound using WebAudio (no external files)
			try{
				const ctx = new (window.AudioContext || window.webkitAudioContext)();
				const o = ctx.createOscillator();
				const g = ctx.createGain();
				o.type = 'sine';
				o.frequency.value = 880; // high-pitched pop
				g.gain.value = 0.0001;
				o.connect(g); g.connect(ctx.destination);
				const now = ctx.currentTime;
				g.gain.setValueAtTime(0.0001, now);
				g.gain.exponentialRampToValueAtTime(0.08, now + 0.02);
				g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
				o.start(now); o.stop(now + 0.2);
			}catch(_){/* ignore if audio blocked */}

			// Also attempt to copy a short message as part of the kiss
			try{
				if (navigator.clipboard) await navigator.clipboard.writeText('A kiss from me to you 😘');
			}catch(_){ }

			// Remove element after animation
			setTimeout(()=>{ b.remove(); }, 1200);

			// Give visual feedback in modal
			const old = kissBtn.textContent;
			kissBtn.textContent = 'Kiss sent! 💌';
			setTimeout(()=>{ kissBtn.textContent = old; }, 1800);
		}

		kissBtn.addEventListener('click', doKiss);
	</script>
</body>
</html>
